# local_rss 配置
#
# 每个 feeds 条目 = 一个 RSS 输出文件。
# type 对应 localrss/providers/ 下已注册的 provider（见 `python3 rss.py --list-types`）。
#
# 注意：定时刷新的间隔不在这里，在 ecosystem.config.js 的 cron_restart（pm2 调度）。

bridge:
  # Kimi WebBridge daemon 地址，一般不用改
  url: http://127.0.0.1:10086/command
  # 所有标签页归到这个 session 的标签组里
  session: local-rss
  group_title: 本地 RSS
  # 运行结束后关掉本次打开的标签页（只关本 session 的，不动你自己的页面）。
  # 也可以用 `python3 rss.py --keep-tabs` 临时保留。
  close_session: true

output:
  dir: output          # RSS 文件输出目录（相对本文件所在目录）
  state_dir: state     # 去重/增量用的状态目录
  log_dir: logs        # 过滤清单的目录（见下面的 dropped_log）
  # 把每轮「过滤掉的条目 + 丢它的原因」写成 <log_dir>/<feed-id>.dropped.log。
  # **每次运行覆盖写**（不是追加）：只保留最近一轮的清单，所以文件很小，
  # 用来回头核对关键词规则有没有误伤。没有过滤掉的条目时也会写一个空清单，
  # 免得上一轮的内容留在文件里冒充本轮。
  dropped_log: true
  # 每个源最多保留多少条（默认值，可被各个 feed 的 history 覆盖）。
  # 注意这是「条数」上限，不按体积算：带全文的源每条体积大得多，所以单独调小了。
  history: 150
  # 订阅服务的地址前缀（由 pm2 里的 local-rss-http 提供，端口见 ecosystem.config.js）。
  # 用于 RSS 里的 <atom:link rel="self">，也是 WebSub 通知 hub 时用的 feed 地址。
  # 注意：这必须是**订阅者和 hub 都用得到的地址**。FreshRSS 拿它当 WebSub 的 topic，
  # 所以填 127.0.0.1 的话 hub 会去抓一个只在本机存在的地址，抓不到就白推。
  base_url: http://100.117.207.33:8666

  # WebSub：内容有更新时 ping 一下 hub，hub 就来抓 feed 并推给订阅者
  # （FreshRSS 秒收，不用等它自己轮询）。留空 = 关闭，RSS 里也不会出现 hub 声明。
  #
  # 指向本机那个自建 hub（local-rss-hub，见 hub.sh / localrss/hub.py），
  # 它同时够得到这台机器的 feed 和 tailnet 上 aliyun 那台的 FreshRSS。
  # 公共 hub（https://websubhub.com/ 之类）用不了 —— 它们在公网上，抓不到 tailnet 里的 feed。
  # 详见 README 的「WebSub」一节。单个源可以在 feeds 里用 hub 键覆盖。
  hub_url: http://100.117.207.33:8667/

# 全局关键词过滤：标题或正文命中任一关键词的条目会被丢掉（大小写不敏感的子串匹配）。
# 对所有 feeds 生效，去掉/关掉就把整个列表清空。
exclude_keywords:
  - 妙界
  - 温眠
  - 小蓝瓶鱼油
  - 护眼仪
  - 护颈枕
  - 小冰席
  - 海力生
  - 冲牙器
  - 小闪电
  - 电动牙刷
  - 互动抽奖
  - 神气小鹿
  - Apple Log课程
  - 足浴
  - Rokid
  - 兰气泡油
  - 捞捞
  - 捞一下
  - 捞一把
  - 捞一手
  - 按摩仪

feeds:
  # ---- B 站动态（关注动态，对应 https://t.bilibili.com/）----
  - id: bilibili-follow
    type: bilibili
    title: bilibili
    description: t.bilibili.com 关注动态
    site_url: https://t.bilibili.com/
    enabled: true
    history: 150         # 纯文本 + 封面，每条约 1.6 KB；满 150 条约 240 KB
    options:
      mode: feed       # feed = 关注动态；space = 指定 UP 主
      max_pages: 3     # 每页约 20 条，抓满 max_pages 或遇到已有记录就停
      # 过滤掉「转发自 @自己」的回环转发（转发的原动态就是本人发的）
      filter_self_repost: false
      # 「图片动态」（DYNAMIC_TYPE_DRAW，带不带正文都算）和「转发」
      # （DYNAMIC_TYPE_FORWARD）单发一条太吵 —— 实测两天 41 + 14 条。
      # 攒够 image_digest_size 条就合成一条合集再进 RSS，内容一条不落
      # （作者/时间/正文/图片/链接都在，转发里的视频播放器也照样嵌）。
      # 设成 0 则关掉合集，退回下面的老行为。详见 README 的「动态合集」。
      image_digest_size: 5
      # 攒不满 image_digest_size 时的兜底：最旧的那条超过这个小时数就照样合成一条，
      # 免得冷清的时候几条内容一直不出现在 RSS 里。设成 0 = 不兜底（一直攒着）。
      image_digest_max_age_hours: 24
      # 上面的 image_digest_size > 0 时本项不再生效；image_digest_size = 0 时才是
      # 「过滤掉纯图动态」
      filter_image_only: true
      # 在每条正文开头放 UP 主头像（RSS 没有「每条一个图标」的字段，只能这样带出来）
      show_avatar: false
      # 视频动态内嵌 B 站播放器（<iframe>）。实测能用的排前面：
      #   mobile      移动版 html5mobileplayer —— 喂渐进式 mp4，iOS 能播；
      #               但在 <video> 上写死了 playsinline，iOS 拿不到原生全屏
      #   html5player blackboard/html5player（当前）—— 不带 playsinline，
      #               加载快，双击可进 iOS 原生全屏且不黑屏
      #   desktop     官方外链 player.bilibili.com —— MSE，实测手机上出不来
      #   newplayer   blackboard/player —— 卡在「播放器初始化」，出不来
      #   false       关闭，只留标题链接 + 封面图
      embed_player: html5player

  # ---- 知乎个人动态 ----
  #
  # 新增一个知乎源只要 id / title / site_url / options.token 四项，其余全部用
  # 下面这些代码里的默认值，不用再抄一遍；需要改哪个，就在该源的 options 下写同名键。
  #   max_pages: 5              最多翻几页
  #   dedupe_by_content: true   正文相同的只保留一条（同一条回答会以「回答了问题」+「收藏了回答」出现两次）
  #   dedupe_memory_days: 45    去重指纹记多久。指纹单独存在 state 里、不跟条目一起裁：
  #                             条目被 history 挤出去之后，同一条正文再被别的动作
  #                             （收藏/赞同/换标题重抓）带出来时，仍然认得出来、不会再发一遍。
  #                             0 = 只比窗口内的条目（老行为，会看到旧文章被重发一次）。
  #   fulltext: true            抓全文（导航到内容页从 DOM 取正文）。每条只抓一次，存在 state 里。
  #   max_fulltext_per_run: 10  每次运行最多补几篇全文（首次启用时历史条目分批补齐，避免单次跑太久）
  #   list_retries: 2           平台偶发风控（返回「请求参数异常，请升级客户端后重试。」）时的短重试次数
  #   list_retry_delay_s: 15    每次重试之间的间隔秒数，不用白等下一个 30 分钟周期
  - id: zhihu-kvxjr369f
    type: zhihu
    title: kvxjr369f
    description: 知乎个人主页动态
    site_url: https://www.zhihu.com/people/kvxjr369f
    enabled: true
    history: 60          # 带全文，每条约 6.6 KB；满 60 条约 400 KB（150 条要 1 MB）
    # 只对这个源生效的关键词过滤，叠加在顶层 exclude_keywords 之上
    exclude_keywords:
      - 关于每天的早安行动
      - 关于素问每日晚间抢答对战
    options:
      token: kvxjr369f

  - id: zhihu-nell
    type: zhihu
    title: nell
    description: 知乎个人主页动态
    site_url: https://www.zhihu.com/people/nell
    enabled: true
    history: 60          # 同上，带全文，别用全局默认的 150
    options:
      token: nell

  - id: zhihu-GalAster
    type: zhihu
    title: GalAster
    description: 知乎个人主页动态
    site_url: https://www.zhihu.com/people/GalAster
    enabled: true
    history: 60          # 同上，带全文，别用全局默认的 150
    options:
      token: GalAster

  - id: zhihu-yuhang-liu
    type: zhihu
    title: yuhang-liu
    description: 知乎个人主页动态
    site_url: https://www.zhihu.com/people/yuhang-liu-34
    enabled: true
    history: 60          # 同上，带全文，别用全局默认的 150
    options:
      token: yuhang-liu-34

